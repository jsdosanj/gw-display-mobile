name: EAS Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (see eas.json)'
        required: true
        default: 'android-apk'
        type: choice
        options:
          - android-apk
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret is not set — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # No --no-wait: this job blocks until the build finishes so its
      # success/failure and logs reflect the actual build outcome, not just
      # whether it was queued.
      - name: Build on EAS
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
